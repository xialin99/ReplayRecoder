plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.replay.recoder'
    compileSdk 34

    defaultConfig {
        applicationId "com.replay.recoder"
        minSdk 29            // Android 10,兼容鸿蒙2.0(API29)起步
        targetSdk 34
        versionCode 9
        versionName "0.3.0"

        // 构建时间 + 构建类型注入 BuildConfig,关于页展示
        buildConfigField "String", "BUILD_TIME", "\"${new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new Date())}\""
        buildConfigField "String", "BUILD_TYPE", "\"debug\""
    }

    // 用 debug 签名为 release 包签名:个人项目内部分发可直接安装,
    // 后续正式上架再换成自有 keystore(release 签名配置见下方 signingConfigs)
    signingConfigs {
        releaseDebugSigned {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            // 开启 R8 代码混淆 + 资源压缩,防止反编译还原业务逻辑
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.releaseDebugSigned
            // release 包覆盖构建类型标记
            buildConfigField "String", "BUILD_TYPE", "\"release\""
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX 基础
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'

    // ExoPlayer / Media3 —— 回放播放器(Transformer 已移除:剪辑/拼接全部改用 FFmpeg)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // FFmpeg —— 剪辑/拼接/压缩
    // full 包带 libx264(H.264 GPL):压缩时用 CRF 28 砍半体积,产物 H.264 可被 Jira/浏览器内嵌预览;
    // min 包只有 mpeg4/mpeg2/hevc_nvenc 等非 H.264 或硬件编码器,产物 Jira 不认
    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // CameraX —— 相机预览/缩放/闪光灯/拍照/录像
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // JSch —— SSH 客户端(工具箱 SSH 工具,连接扫地机等嵌入式设备)
    implementation 'com.jcraft:jsch:0.1.55'
    // VT100 终端模拟器(SSH 交互式终端,支持 vi/vim/top 等全屏程序)
    implementation 'com.github.jackpal:Android-Terminal-Emulator:v1.0.70'
}
